<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<title>🧠 Мозговые головоломки</title>
<style>
  :root{ --ink:#26313f; --yellow:#ffd23b; --green:#3ecf5e; --red:#ff5252; --blue:#3b9bff; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; }
  body{ font-family:-apple-system,'SF Pro Rounded','Segoe UI',system-ui,sans-serif; background:#fff; color:var(--ink); user-select:none; -webkit-user-select:none; }
  #err{ position:fixed; left:8px; right:8px; bottom:8px; z-index:9999; background:#b00020; color:#fff; font:12px/1.4 monospace; padding:8px 10px; border-radius:10px; display:none; white-space:pre-wrap; }
  button{ font-family:inherit; }

  /* ---------- общие кнопки ---------- */
  .big{ display:block; width:min(340px,80vw); margin:10px auto; padding:16px 20px; font-size:22px; font-weight:800; color:#fff; background:linear-gradient(180deg,#4fb2ff,#2f7fe0); border:none; border-radius:18px; box-shadow:0 6px 0 #1d5ba8; cursor:pointer; }
  .big:active{ transform:translateY(4px); box-shadow:0 2px 0 #1d5ba8; }
  .big.gold{ background:linear-gradient(180deg,#ffd856,#f5a623); box-shadow:0 6px 0 #b4771a; }
  .big.gold:active{ box-shadow:0 2px 0 #b4771a; }
  .chip{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; background:#fff; border:3px solid #e7ecf3; border-radius:999px; font-weight:800; font-size:18px; box-shadow:0 3px 0 #e0e6ee; cursor:pointer; }
  .chip:active{ transform:translateY(2px); box-shadow:none; }

  /* ---------- меню ---------- */
  .screen{ position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; background:#fff; z-index:10; }
  .screen.show{ display:flex; }
  #menu h1{ font-size:min(9vw,44px); margin:12px 0 2px; text-align:center; }
  #menu .sub{ color:#8b97a6; font-weight:700; margin-bottom:14px; }
  #menuLogo{ width:min(44vw,200px); height:auto; }
  #menuStats{ position:fixed; top:12px; right:12px; display:flex; gap:8px; }

  /* ---------- выбор уровня ---------- */
  #levels{ justify-content:flex-start; padding-top:64px; }
  #levelsGrid{ display:grid; grid-template-columns:repeat(auto-fill,64px); gap:10px; justify-content:center; width:min(92vw,640px); max-height:76vh; overflow-y:auto; padding:6px; }
  .lvBtn{ width:64px; height:64px; border-radius:16px; border:none; font-size:19px; font-weight:900; color:#fff; cursor:pointer; }
  .lvBtn.done{ background:linear-gradient(180deg,#57de77,#2fae52); box-shadow:0 4px 0 #1f7c38; }
  .lvBtn.next{ background:linear-gradient(180deg,#ffd856,#f5a623); box-shadow:0 4px 0 #b4771a; animation:pulse 1.2s infinite; }
  .lvBtn.lock{ background:#cfd6df; box-shadow:0 4px 0 #aeb7c2; cursor:default; }
  @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.07);} }
  .backChip{ position:fixed; top:12px; left:12px; }

  /* ---------- игровой экран ---------- */
  #game{ display:none; position:fixed; inset:0; background:#fff; }
  #game.show{ display:block; }
  #hud{ position:fixed; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between; padding:10px 12px; z-index:20; pointer-events:none; }
  #hud > *{ pointer-events:auto; }
  #bulbBox{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  #statusBulbs{ display:flex; gap:14px; align-items:center; background:#fff; border:3px solid #e7ecf3; border-radius:999px; padding:6px 18px; box-shadow:0 3px 0 #e0e6ee; }
  .sbulb{ width:26px; height:26px; border-radius:50%; border:3px solid #b9c2cd; background:#eef1f5; transition:all .25s; }
  .sbulb.red.on{ background:var(--red); border-color:#c22; box-shadow:0 0 18px 4px rgba(255,60,60,.75); }
  .sbulb.green.on{ background:var(--green); border-color:#1d8f3d; box-shadow:0 0 18px 4px rgba(50,220,90,.75); }
  #lvLabel{ font-weight:900; font-size:15px; color:#8b97a6; margin-top:3px; }
  #task{ position:fixed; top:88px; left:0; right:0; text-align:center; font-size:min(4.6vw,21px); font-weight:900; padding:0 14px; z-index:15; pointer-events:none; }
  #scene{ position:absolute; top:130px; left:6px; right:76px; bottom:6px; display:flex; align-items:center; justify-content:center; }
  #scene svg{ width:100%; height:100%; touch-action:none; display:block; }
  #dock{ position:fixed; right:10px; bottom:10px; display:flex; flex-direction:column; gap:10px; z-index:25; }
  /* маленький экран боком (телефон): ужимаем шапку и кнопки, головоломке — максимум места */
  @media (max-height:520px){
    #task{ top:64px; font-size:15px; }
    #scene{ top:88px; right:64px; left:4px; bottom:4px; }
    .dockBtn{ width:46px; height:46px; border-radius:14px; font-size:19px; }
    .dockBtn small{ font-size:7px; }
    #dock{ gap:6px; right:8px; bottom:8px; }
    #hud{ padding:6px 8px; }
    .chip{ font-size:15px; padding:5px 10px; }
    .sbulb{ width:20px; height:20px; }
    #lvLabel{ font-size:12px; margin-top:2px; }
  }
  .dockBtn{ width:58px; height:58px; border-radius:18px; border:none; font-size:26px; cursor:pointer; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; }
  .dockBtn small{ font-size:9px; font-weight:900; margin-top:2px; }
  .dockBtn.shop{ background:linear-gradient(180deg,#ff9e57,#f06e21); box-shadow:0 4px 0 #b34a0e; }
  .dockBtn.list{ background:linear-gradient(180deg,#b98bff,#8a54e8); box-shadow:0 4px 0 #5c33a6; }
  .dockBtn.home{ background:linear-gradient(180deg,#4fb2ff,#2f7fe0); box-shadow:0 4px 0 #1d5ba8; }
  .dockBtn.snd{ background:linear-gradient(180deg,#8fa4b8,#64798e); box-shadow:0 4px 0 #47586a; }
  .dockBtn:active{ transform:translateY(3px); box-shadow:none !important; }

  /* ---------- оверлеи ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(12,16,26,.88); z-index:40; display:none; align-items:center; justify-content:center; }
  .overlay.show{ display:flex; }
  .card{ width:min(88vw,420px); background:#1b2333; border-radius:24px; padding:26px 22px; text-align:center; color:#fff; box-shadow:0 18px 60px rgba(0,0,0,.5); }
  .card .bigEmoji{ font-size:64px; line-height:1; filter:drop-shadow(0 0 22px rgba(255,220,80,.5)); }
  .card h2{ margin:10px 0 6px; font-size:26px; }
  .card .phrase{ font-size:19px; font-weight:700; color:#dfe7f5; min-height:52px; }
  .card .reward{ font-size:22px; font-weight:900; color:var(--yellow); margin:8px 0; }
  .shopRow{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:#242f45; border-radius:16px; padding:12px 14px; margin:10px 0; font-weight:800; font-size:17px; color:#fff; }
  .shopRow button{ padding:10px 16px; font-size:16px; font-weight:900; color:#3a2400; background:linear-gradient(180deg,#ffd856,#f5a623); border:none; border-radius:12px; box-shadow:0 4px 0 #b4771a; cursor:pointer; }
  .shopRow button:disabled{ filter:grayscale(1); opacity:.6; }
  .shopRow button:active{ transform:translateY(3px); box-shadow:none; }
  #toast{ position:fixed; left:50%; bottom:84px; transform:translateX(-50%); background:#1b2333; color:#fff; font-weight:800; padding:12px 20px; border-radius:999px; z-index:60; display:none; box-shadow:0 8px 30px rgba(0,0,0,.35); max-width:86vw; text-align:center; pointer-events:none; }
  .xClose{ position:absolute; top:10px; right:12px; background:none; border:none; color:#8b97a6; font-size:26px; cursor:pointer; }
  .cardWrap{ position:relative; }

@media(max-width:480px) and (min-height:521px){#menu::before{inset:73px 13px 34px;border-radius:31px}#menu h1{font-size:32px;max-width:310px}#menuLogo{width:170px}#menu .sub{font-size:13px;text-align:center}#scene{top:143px;left:7px;right:61px;bottom:9px;padding:4px;border-radius:18px}#task{top:93px;font-size:16px;padding:0 13px}#dock{right:6px;bottom:13px;gap:10px}.dockBtn{width:46px;height:46px;font-size:21px;border-radius:14px}.dockBtn small{font-size:7px}#hud .chip{padding:7px 9px;font-size:15px}#statusBulbs{padding:7px 12px}#levelsGrid{grid-template-columns:repeat(auto-fill,58px);width:94vw;gap:11px}.lvBtn{width:58px;height:58px}}

@media(max-width:480px) and (min-height:521px){#scene{top:154px;left:7px;right:7px;bottom:auto;aspect-ratio:800/560}#dock{left:50%;right:auto;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);flex-direction:row;gap:12px}.dockBtn{width:58px;height:58px;font-size:26px;border-radius:17px}.dockBtn small{font-size:8px}body:has(#game.show) #mkl-bar{top:auto;bottom:100px;left:50%;transform:translateX(-50%);flex-direction:row}}

<body>
<div id="err"></div>

<!-- ======== МЕНЮ ======== -->
<div id="menu" class="screen show">
  <div id="menuStats">
    <span class="chip">💡 <span id="mBulbs">0</span></span>
    <span class="chip">🪙 <span id="mCoins">0</span></span>
  </div>
  <svg id="menuLogo" viewBox="0 0 200 200">
    <g id="logoQ" font-size="26" font-weight="900" fill="#b9c2cd"></g>
    <g transform="translate(100,96)">
      <circle r="46" fill="#ffd23b" stroke="#e8a800" stroke-width="5"/>
      <path d="M-14,38 h28 v10 a8 8 0 0 1 -8 8 h-12 a8 8 0 0 1 -8 -8 z" fill="#9aa7b5" stroke="#7c8896" stroke-width="3"/>
      <path d="M-12,10 q12,-14 0,-26 M12,10 q-12,-14 0,-26" stroke="#e8a800" stroke-width="4" fill="none" stroke-linecap="round"/>
      <g stroke="#ffd23b" stroke-width="6" stroke-linecap="round">
        <line x1="0" y1="-62" x2="0" y2="-78"/><line x1="44" y1="-44" x2="55" y2="-55"/><line x1="-44" y1="-44" x2="-55" y2="-55"/>

<!-- ======== ВЫБОР УРОВНЯ ======== -->

<!-- ======== ИГРА ======== -->

<!-- ======== ИТОГ УРОВНЯ ======== -->
<div id="result" class="overlay">
  <div class="card">
    <div class="bigEmoji" id="resEmoji">💡</div>

    <div class="phrase" id="resPhrase"></div>
    <div class="reward" id="resReward"></div>
    <button class="big gold" id="resNext" style="width:100%">Дальше ▶</button>
    <button class="big" id="resRetry" style="width:100%">Ещё раз 🔁</button>

</div>

<!-- ======== МАГАЗИН ======== -->
<div id="shop" class="overlay">
  <div class="card cardWrap">
    <button class="xClose" id="shopClose">✕</button>
    <div class="bigEmoji">🛒</div>
    <h2>Магазин</h2>

<!-- ======== ПОДСКАЗКА ======== -->

<script>
'use strict';
// ======== ошибки на экран (Марк не видит консоль) ========
window.onerror = function (m, s, l, c) { const e = document.getElementById('err'); e.style.display = 'block'; e.textContent = '⚠️ ' + m + ' (стр. ' + l + ':' + c + ')'; };

// ======== сохранение ========
const SAVE_KEY = 'brainPuzzles_v1';
let S = { coins: 0, bulbs: 1, passed: {}, lastGift: '', sound: true };
try { Object.assign(S, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) {}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

// ======== утилиты ========
const el = id => document.getElementById(id);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, rnd) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let toastT = null;
function toast(msg) { const t = el('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 2200); }
const NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs, parent) { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }
function svgPt(svg, ev) { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }

// ======== звук: детективная музыка + эффекты ========
let actx = null, musicOn = false, musicTimer = null;
function initAudio() { if (actx) return; try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
function blip(freq, dur, type, vol, when) {
  if (!actx || !S.sound) return; const t = when || actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine'; o.frequency.value = freq; g.gain.value = 0.0001;
  o.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol || 0.15, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.2));
  o.start(t); o.stop(t + (dur || 0.2) + 0.05);
}
function sndClick() { blip(700, 0.06, 'triangle', 0.08); }

const TYPES = {};
const WIRE_COLORS = ['#ff5252', '#3b9bff', '#3ecf5e', '#ffb300', '#b455ff', '#00c9c9', '#ff6ec7', '#8d6e63'];

// ---------- 🔌 ПРОВОДА ----------
TYPES.wires = { build(svg, p, api) {
  const n = p.n || 3, rng = api.rng;
  const H = 560, top = 130, bot = H - 60;
  const ys = []; for (let i = 0; i < n; i++) ys.push(top + (bot - top) * (n === 1 ? 0.5 : i / (n - 1)));
  // решение: розетка i на той же «высотной позиции», что вилка i (порядок сохранён → не пересекается)
  // плюс обманки: лишние розетки тех же цветов в перепутанных местах
  const colors = shuffle(WIRE_COLORS.slice(0, n), rng);
  const plugY = ys.slice();
  const sockSlots = shuffle(ys.slice(), rng); // визуально розетки стоят в другом порядке по вертикали? нет:
  //正解-розетки в том же порядке, обманки — со сдвигом
  const sockets = [];
  for (let i = 0; i < n; i++) sockets.push({ y: ys[i], color: colors[i], ok: true });
  const extra = Math.min(p.extra == null ? Math.max(1, n - 2) : p.extra, n);
  const used = new Set();
  for (let k = 0; k < extra; k++) {
    let i; do { i = Math.floor(rng() * n); } while (used.has(i)); used.add(i);
    let j; do { j = Math.floor(rng() * n); } while (Math.abs(j - i) < 1);
    sockets.push({ y: ys[j] + (rng() - 0.5) * 26, color: colors[i], ok: false });
  }
  shuffle(sockets, rng);
  const wiresG = svgEl('g', {}, svg), plugsG = svgEl('g', {}, svg), socksG = svgEl('g', {}, svg);
  const conns = new Map(); // plugIdx -> socket obj
  const sockTaken = new Set();
  const plugs = [];
  for (let i = 0; i < n; i++) {
    const g = svgEl('g', { transform: 'translate(70,' + plugY[i] + ')', cursor: 'pointer' }, plugsG);
    svgEl('rect', { x: -46, y: -16, width: 52, height: 32, rx: 8, fill: colors[i], stroke: '#26313f', 'stroke-width': 3 }, g);
    svgEl('rect', { x: 6, y: -7, width: 16, height: 4, rx: 2, fill: '#c9a44a' }, g);
    svgEl('rect', { x: 6, y: 3, width: 16, height: 4, rx: 2, fill: '#c9a44a' }, g);
    plugs.push({ x: 92, y: plugY[i], color: colors[i], g });
  }
  sockets.forEach(sk => {
    const g = svgEl('g', { transform: 'translate(724,' + sk.y + ')' }, socksG);
    svgEl('rect', { x: -14, y: -20, width: 44, height: 40, rx: 10, fill: '#f2f5f9', stroke: sk.color, 'stroke-width': 5 }, g);
    svgEl('circle', { cx: 8, cy: -7, r: 3.4, fill: '#26313f' }, g);
    svgEl('circle', { cx: 8, cy: 7, r: 3.4, fill: '#26313f' }, g);
    sk.gx = 710; sk.gy = sk.y; sk.g = g;
  });
  let drag = null, tempLine = null;
  function lineFor(i, x2, y2) { return 'M' + plugs[i].x + ',' + plugs[i].y + ' L' + x2 + ',' + y2; }
  function redraw() {
    wiresG.innerHTML = '';
    conns.forEach((sk, i) => svgEl('path', { d: lineFor(i, sk.gx, sk.gy), stroke: plugs[i].color, 'stroke-width': 8, fill: 'none', 'stroke-linecap': 'round' }, wiresG));
    if (drag != null && tempLine) wiresG.appendChild(tempLine);
  }
  function segsCross(a1, a2, b1, b2) {
    const d = (p, q, r) => (q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x);
    const s1 = d(a1, a2, b1), s2 = d(a1, a2, b2), s3 = d(b1, b2, a1), s4 = d(b1, b2, a2);
    return ((s1 > 0) !== (s2 > 0)) && ((s3 > 0) !== (s4 > 0));
  }
  function checkDone() {
    if (conns.size < n) return;
    const segs = [...conns.entries()].map(([i, sk]) => [{ x: plugs[i].x, y: plugs[i].y }, { x: sk.gx, y: sk.gy }]);
    for (let i = 0; i < segs.length; i++) for (let j = i + 1; j < segs.length; j++)
      if (segsCross(segs[i][0], segs[i][1], segs[j][0], segs[j][1])) return api.fail();
    api.win();
  }
  svg.addEventListener('pointerdown', ev => {
    const pt = svgPt(svg, ev);
    for (let i = 0; i < n; i++) if (Math.hypot(pt.x - plugs[i].x + 20, pt.y - plugs[i].y) < 46) {
      if (conns.has(i)) { sockTaken.delete(conns.get(i)); conns.delete(i); }
      drag = i; tempLine = svgEl('path', { d: lineFor(i, pt.x, pt.y), stroke: plugs[i].color, 'stroke-width': 8, fill: 'none', 'stroke-linecap': 'round', opacity: 0.75 }, null);
      redraw(); sndClick(); ev.preventDefault(); return;
    }
  });
  api.on(window, 'pointermove', ev => { if (drag == null) return; const pt = svgPt(svg, ev); tempLine.setAttribute('d', lineFor(drag, pt.x, pt.y)); });
  api.on(window, 'pointerup', ev => {
    if (drag == null) return; const pt = svgPt(svg, ev);
    let hit = null;
    for (const sk of sockets) if (!sockTaken.has(sk) && sk.color === plugs[drag].color && Math.hypot(pt.x - sk.gx - 8, pt.y - sk.gy) < 42) { hit = sk; break; }
    if (hit) { conns.set(drag, hit); sockTaken.add(hit); sndClick(); }
    drag = null; tempLine = null; redraw();
    checkDone();
  });
  redraw();
} };

// ---------- 🚰 ТРУБЫ С ВОДОЙ (идея Марка!) ----------
const DIRS = { N: [0, -1], E: [1, 0], S: [0, 1], W: [-1, 0] };

  let x = 0, y = sr, inDir = 'W', er = sr;
  visited.add(x + ',' + y);
  while (true) {
    const opts = [];
    if (x < W - 1 && !visited.has((x + 1) + ',' + y)) opts.push('E', 'E');
    if (y > 0 && !visited.has(x + ',' + (y - 1))) opts.push('N');

  const tiles = [];
  for (let cy = 0; cy < H; cy++) for (let cx = 0; cx < W; cx++) {
    const key = cx + ',' + cy;

    }

        if (cy === er) { wet.forEach(w => drawPipe(w, true)); flower.textContent = '🌻'; svgEl('text', { x: ox + W * CS + 44, y: oy + er * CS + CS / 2 - 34, 'font-size': 26, 'text-anchor': 'middle' }, svg).textContent = '💧'; api.win(); }

    }
  }
} };

const MAZE_PATHS = [

TYPES.mazefinger = { build(svg, p, api) {

  svgEl('path', { d, stroke: '#c6d2e0', 'stroke-width': 4, fill: 'none', 'stroke-dasharray': '10 12' }, svg);

      const wt = svgEl('text', { x: wx, y: wy + 11, 'text-anchor': 'middle', 'font-size': 30 }, svg); wt.textContent = '🕸️';

<script>
(function(){
  var ЛОББИ = 'https://maksimdodychin.github.io/mark-arcade/';
  var К = 1, бар = document.getElementById('mkl-bar');
  function мигнуть(){ бар.classList.add('mkl-act'); clearTimeout(бар._t);
    бар._t = setTimeout(function(){ бар.classList.remove('mkl-act'); }, 1800); }
  /* 🔍 приближение: если игра сама умеет (window.__zoom) — просим её,
     иначе увеличиваем всю страницу и говорим игре пересчитать размер экрана. */
  function зум(шаг){
    К = Math.max(0.7, Math.min(1.8, +(К + шаг).toFixed(2)));
    if (typeof window.__zoom === 'function') { window.__zoom(К); }
    else {
      document.body.style.transformOrigin = 'center center';
      document.body.style.zoom = К;
      try { window.dispatchEvent(new Event('resize')); } catch(e){}
    }
    мигнуть();
  }
  document.getElementById('mkl-in').onclick  = function(){ зум(+0.15); };
  document.getElementById('mkl-out').onclick = function(){ зум(-0.15); };
  var ask = document.getElementById('mkl-ask');
  document.getElementById('mkl-home').onclick = function(){ ask.classList.add('mkl-on'); };
  document.getElementById('mkl-cancel').onclick = function(){ ask.classList.remove('mkl-on'); };
  document.getElementById('mkl-ok').onclick = function(){ location.href = ЛОББИ; };
  ask.onclick = function(e){ if (e.target === ask) ask.classList.remove('mkl-on'); };
  мигнуть();
})();
</script>
