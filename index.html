<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<title>🧠 Мозговые головоломки</title>
<style>
  :root{ --ink:#26313f; --yellow:#ffd23b; --green:#3ecf5e; --red:#ff5252; --blue:#3b9bff; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; }
  body{ font-family:-apple-system,'SF Pro Rounded','Segoe UI',system-ui,sans-serif; background:#fff; color:var(--ink); user-select:none; -webkit-user-select:none; }
  #err{ position:fixed; left:8px; right:8px; bottom:8px; z-index:9999; background:#b00020; color:#fff; font:12px/1.4 monospace; padding:8px 10px; border-radius:10px; display:none; white-space:pre-wrap; }
  button{ font-family:inherit; }

  /* ---------- общие кнопки ---------- */
  .big{ display:block; width:min(340px,80vw); margin:10px auto; padding:16px 20px; font-size:22px; font-weight:800; color:#fff; background:linear-gradient(180deg,#4fb2ff,#2f7fe0); border:none; border-radius:18px; box-shadow:0 6px 0 #1d5ba8; cursor:pointer; }
  .big:active{ transform:translateY(4px); box-shadow:0 2px 0 #1d5ba8; }
  .big.gold{ background:linear-gradient(180deg,#ffd856,#f5a623); box-shadow:0 6px 0 #b4771a; }
  .big.gold:active{ box-shadow:0 2px 0 #b4771a; }
  .chip{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; background:#fff; border:3px solid #e7ecf3; border-radius:999px; font-weight:800; font-size:18px; box-shadow:0 3px 0 #e0e6ee; cursor:pointer; }
  .chip:active{ transform:translateY(2px); box-shadow:none; }

  /* ---------- меню ---------- */
  .screen{ position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; background:#fff; z-index:10; }
  .screen.show{ display:flex; }
  #menu h1{ font-size:min(9vw,44px); margin:12px 0 2px; text-align:center; }
  #menu .sub{ color:#8b97a6; font-weight:700; margin-bottom:14px; }
  #menuLogo{ width:min(44vw,200px); height:auto; }
  #menuStats{ position:fixed; top:12px; right:12px; display:flex; gap:8px; }

  /* ---------- выбор уровня ---------- */
  #levels{ justify-content:flex-start; padding-top:64px; }
  #levelsGrid{ display:grid; grid-template-columns:repeat(auto-fill,64px); gap:10px; justify-content:center; width:min(92vw,640px); max-height:76vh; overflow-y:auto; padding:6px; }
  .lvBtn{ width:64px; height:64px; border-radius:16px; border:none; font-size:19px; font-weight:900; color:#fff; cursor:pointer; }
  .lvBtn.done{ background:linear-gradient(180deg,#57de77,#2fae52); box-shadow:0 4px 0 #1f7c38; }
  .lvBtn.next{ background:linear-gradient(180deg,#ffd856,#f5a623); box-shadow:0 4px 0 #b4771a; animation:pulse 1.2s infinite; }
  .lvBtn.lock{ background:#cfd6df; box-shadow:0 4px 0 #aeb7c2; cursor:default; }
  @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.07);} }
  .backChip{ position:fixed; top:12px; left:12px; }

  /* ---------- игровой экран ---------- */
  #game{ display:none; position:fixed; inset:0; background:#fff; }
  #game.show{ display:block; }
  #hud{ position:fixed; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between; padding:10px 12px; z-index:20; pointer-events:none; }
  #hud > *{ pointer-events:auto; }
  #bulbBox{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  #statusBulbs{ display:flex; gap:14px; align-items:center; background:#fff; border:3px solid #e7ecf3; border-radius:999px; padding:6px 18px; box-shadow:0 3px 0 #e0e6ee; }
  .sbulb{ width:26px; height:26px; border-radius:50%; border:3px solid #b9c2cd; background:#eef1f5; transition:all .25s; }
  .sbulb.red.on{ background:var(--red); border-color:#c22; box-shadow:0 0 18px 4px rgba(255,60,60,.75); }
  .sbulb.green.on{ background:var(--green); border-color:#1d8f3d; box-shadow:0 0 18px 4px rgba(50,220,90,.75); }
  #lvLabel{ font-weight:900; font-size:15px; color:#8b97a6; margin-top:3px; }
  #task{ position:fixed; top:88px; left:0; right:0; text-align:center; font-size:min(4.6vw,21px); font-weight:900; padding:0 14px; z-index:15; pointer-events:none; }
  #scene{ position:absolute; top:130px; left:6px; right:76px; bottom:6px; display:flex; align-items:center; justify-content:center; }
  #scene svg{ width:100%; height:100%; touch-action:none; display:block; }
  #dock{ position:fixed; right:10px; bottom:10px; display:flex; flex-direction:column; gap:10px; z-index:25; }
  .dockBtn{ width:58px; height:58px; border-radius:18px; border:none; font-size:26px; cursor:pointer; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; }
  .dockBtn small{ font-size:9px; font-weight:900; margin-top:2px; }
  .dockBtn.shop{ background:linear-gradient(180deg,#ff9e57,#f06e21); box-shadow:0 4px 0 #b34a0e; }
  .dockBtn.list{ background:linear-gradient(180deg,#b98bff,#8a54e8); box-shadow:0 4px 0 #5c33a6; }
  .dockBtn.home{ background:linear-gradient(180deg,#4fb2ff,#2f7fe0); box-shadow:0 4px 0 #1d5ba8; }
  .dockBtn.snd{ background:linear-gradient(180deg,#8fa4b8,#64798e); box-shadow:0 4px 0 #47586a; }
  .dockBtn:active{ transform:translateY(3px); box-shadow:none !important; }

  /* ---------- оверлеи ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(12,16,26,.88); z-index:40; display:none; align-items:center; justify-content:center; }
  .overlay.show{ display:flex; }
  .card{ width:min(88vw,420px); background:#1b2333; border-radius:24px; padding:26px 22px; text-align:center; color:#fff; box-shadow:0 18px 60px rgba(0,0,0,.5); }
  .card .bigEmoji{ font-size:64px; line-height:1; filter:drop-shadow(0 0 22px rgba(255,220,80,.5)); }
  .card h2{ margin:10px 0 6px; font-size:26px; }
  .card .phrase{ font-size:19px; font-weight:700; color:#dfe7f5; min-height:52px; }
  .card .reward{ font-size:22px; font-weight:900; color:var(--yellow); margin:8px 0; }
  .shopRow{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:#242f45; border-radius:16px; padding:12px 14px; margin:10px 0; font-weight:800; font-size:17px; color:#fff; }
  .shopRow button{ padding:10px 16px; font-size:16px; font-weight:900; color:#3a2400; background:linear-gradient(180deg,#ffd856,#f5a623); border:none; border-radius:12px; box-shadow:0 4px 0 #b4771a; cursor:pointer; }
  .shopRow button:disabled{ filter:grayscale(1); opacity:.6; }
  .shopRow button:active{ transform:translateY(3px); box-shadow:none; }
  #toast{ position:fixed; left:50%; bottom:84px; transform:translateX(-50%); background:#1b2333; color:#fff; font-weight:800; padding:12px 20px; border-radius:999px; z-index:60; display:none; box-shadow:0 8px 30px rgba(0,0,0,.35); max-width:86vw; text-align:center; }
  .xClose{ position:absolute; top:10px; right:12px; background:none; border:none; color:#8b97a6; font-size:26px; cursor:pointer; }
  .cardWrap{ position:relative; }
</style>
</head>
<body>
<div id="err"></div>

<!-- ======== МЕНЮ ======== -->
<div id="menu" class="screen show">
  <div id="menuStats">
    <span class="chip">💡 <span id="mBulbs">0</span></span>
    <span class="chip">🪙 <span id="mCoins">0</span></span>
  </div>
  <svg id="menuLogo" viewBox="0 0 200 200">
    <g id="logoQ" font-size="26" font-weight="900" fill="#b9c2cd"></g>
    <g transform="translate(100,96)">
      <circle r="46" fill="#ffd23b" stroke="#e8a800" stroke-width="5"/>
      <path d="M-14,38 h28 v10 a8 8 0 0 1 -8 8 h-12 a8 8 0 0 1 -8 -8 z" fill="#9aa7b5" stroke="#7c8896" stroke-width="3"/>
      <path d="M-12,10 q12,-14 0,-26 M12,10 q-12,-14 0,-26" stroke="#e8a800" stroke-width="4" fill="none" stroke-linecap="round"/>
      <g stroke="#ffd23b" stroke-width="6" stroke-linecap="round">
        <line x1="0" y1="-62" x2="0" y2="-78"/><line x1="44" y1="-44" x2="55" y2="-55"/><line x1="-44" y1="-44" x2="-55" y2="-55"/>
        <line x1="62" y1="0" x2="78" y2="0"/><line x1="-62" y1="0" x2="-78" y2="0"/>
      </g>
    </g>
  </svg>
  <h1>Мозговые головоломки</h1>
  <div class="sub">100 хитрых загадок с подвохом 🕵️</div>
  <button class="big gold" id="playBtn">▶ ИГРАТЬ</button>
  <button class="big" id="pickBtn">📋 Выбрать уровень</button>
</div>

<!-- ======== ВЫБОР УРОВНЯ ======== -->
<div id="levels" class="screen">
  <button class="chip backChip" id="lvBack">◀ Меню</button>
  <h2 style="margin:6px 0 12px">Выбери уровень</h2>
  <div id="levelsGrid"></div>
</div>

<!-- ======== ИГРА ======== -->
<div id="game">
  <div id="scene"></div>
  <div id="hud">
    <span class="chip" id="hintBtn">💡 <span id="gBulbs">0</span></span>
    <div id="bulbBox">
      <div id="statusBulbs"><div class="sbulb red" id="redBulb"></div><div class="sbulb green" id="greenBulb"></div></div>
      <div id="lvLabel">Уровень 1</div>
    </div>
    <span class="chip">🪙 <span id="gCoins">0</span></span>
  </div>
  <div id="task"></div>
  <div id="dock">
    <button class="dockBtn shop" id="shopBtn">🛒<small>МАГАЗИН</small></button>
    <button class="dockBtn list" id="listBtn">📋<small>УРОВНИ</small></button>
    <button class="dockBtn home" id="homeBtn">🏠<small>МЕНЮ</small></button>
    <button class="dockBtn snd" id="sndBtn">🔊<small>ЗВУК</small></button>
  </div>
</div>

<!-- ======== ИТОГ УРОВНЯ ======== -->
<div id="result" class="overlay">
  <div class="card">
    <div class="bigEmoji" id="resEmoji">💡</div>
    <h2 id="resTitle">Правильно!</h2>
    <div class="phrase" id="resPhrase"></div>
    <div class="reward" id="resReward"></div>
    <button class="big gold" id="resNext" style="width:100%">Дальше ▶</button>
    <button class="big" id="resRetry" style="width:100%">Ещё раз 🔁</button>
  </div>
</div>

<!-- ======== МАГАЗИН ======== -->
<div id="shop" class="overlay">
  <div class="card cardWrap">
    <button class="xClose" id="shopClose">✕</button>
    <div class="bigEmoji">🛒</div>
    <h2>Магазин</h2>
    <div style="font-weight:800;color:#9fb0c8">У тебя: 🪙 <span id="sCoins">0</span> · 💡 <span id="sBulbs">0</span></div>
    <div class="shopRow"><span>💡 1 подсказка</span><button id="buy1">30 🪙</button></div>
    <div class="shopRow"><span>💡×3 подсказки</span><button id="buy3">75 🪙</button></div>
    <div class="shopRow"><span>🎁 Подарок дня</span><button id="giftBtn">+10 🪙</button></div>
  </div>
</div>

<!-- ======== ПОДСКАЗКА ======== -->
<div id="hintPop" class="overlay">
  <div class="card cardWrap">
    <button class="xClose" id="hintClose">✕</button>
    <div class="bigEmoji">💡</div>
    <h2>Подсказка</h2>
    <div class="phrase" id="hintText"></div>
    <button class="big gold" id="hintUse" style="width:100%">Показать за 1 💡</button>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';
// ======== ошибки на экран (Марк не видит консоль) ========
window.onerror = function (m, s, l, c) { const e = document.getElementById('err'); e.style.display = 'block'; e.textContent = '⚠️ ' + m + ' (стр. ' + l + ':' + c + ')'; };

// ======== сохранение ========
const SAVE_KEY = 'brainPuzzles_v1';
let S = { coins: 0, bulbs: 1, passed: {}, lastGift: '', sound: true };
try { Object.assign(S, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) {}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

// ======== утилиты ========
const el = id => document.getElementById(id);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, rnd) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let toastT = null;
function toast(msg) { const t = el('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 2200); }
const NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs, parent) { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }
function svgPt(svg, ev) { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }

// ======== звук: детективная музыка + эффекты ========
let actx = null, musicOn = false, musicTimer = null;
function initAudio() { if (actx) return; try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
function blip(freq, dur, type, vol, when) {
  if (!actx || !S.sound) return; const t = when || actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine'; o.frequency.value = freq; g.gain.value = 0.0001;
  o.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol || 0.15, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.2));
  o.start(t); o.stop(t + (dur || 0.2) + 0.05);
}
function sndClick() { blip(700, 0.06, 'triangle', 0.08); }
function sndCoin() { blip(880, 0.1, 'sine', 0.12); blip(1320, 0.18, 'sine', 0.12, actx ? actx.currentTime + 0.08 : 0); }
function sndWin() { if (!actx || !S.sound) return; const t = actx.currentTime; [523, 659, 784, 1047].forEach((f, i) => blip(f, 0.22, 'triangle', 0.16, t + i * 0.12)); }
function sndFail() { if (!actx || !S.sound) return; const t = actx.currentTime; blip(300, 0.25, 'sawtooth', 0.08, t); blip(230, 0.35, 'sawtooth', 0.08, t + 0.22); }
// крадущийся детективный бас + щёточки
const BASS_SEQ = [110, 0, 130.8, 110, 146.8, 0, 130.8, 110, 110, 0, 130.8, 146.8, 164.8, 0, 146.8, 130.8];
let seqStep = 0, nextNote = 0;
function scheduleMusic() {
  if (!actx || !S.sound || !musicOn) return;
  const ahead = actx.currentTime + 0.15;
  while (nextNote < ahead) {
    const f = BASS_SEQ[seqStep % BASS_SEQ.length];
    if (f) { const o = actx.createOscillator(), g = actx.createGain(); o.type = 'triangle'; o.frequency.value = f; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(0.0001, nextNote); g.gain.linearRampToValueAtTime(0.07, nextNote + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, nextNote + 0.26); o.start(nextNote); o.stop(nextNote + 0.3); }
    if (seqStep % 2 === 1) { const b = actx.createBuffer(1, 1200, actx.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length); const src = actx.createBufferSource(); src.buffer = b; const g = actx.createGain(); g.gain.value = 0.018; const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6000; src.connect(hp); hp.connect(g); g.connect(actx.destination); src.start(nextNote); }
    if (seqStep % 32 === 24) blip(587, 1.1, 'sine', 0.03, nextNote); // загадочная нотка
    seqStep++; nextNote += 0.24;
  }
}
function startMusic() { initAudio(); if (!actx) return; musicOn = true; nextNote = Math.max(nextNote, actx.currentTime + 0.05); if (!musicTimer) musicTimer = setInterval(scheduleMusic, 60); }
function stopMusic() { musicOn = false; }

// ======== фразы поддержки ========
const WIN_PHRASES = [
  'Отлично! Ты молодец! Это было непросто, но не для тебя!',
  'Гений! Чистая работа! 🧠',
  'Вот это мозги! Так держать!',
  'Невероятно! Ты щёлкаешь загадки как орешки!',
  'Браво! Даже я бы так быстро не догадался!',
  'Супер! Ни одна загадка перед тобой не устоит!',
  'Ты настоящий детектив! 🕵️',
  'Блестяще! Лампочка гордится тобой!',
  'Ура! Ещё одна тайна раскрыта!',
  'Мощно! Твой мозг сегодня в ударе!',
  'Точно в цель! Ты умнее, чем задачка!',
  'Ого! Это было хитро, но ты хитрее!',
  'Победа! Загадки дрожат от страха!',
  'Красота! Решено как по нотам!',
  'Ты просто чемпион по загадкам!',
  'Вот это скорость мысли! Молния! ⚡',
];
const FAIL_PHRASES = [
  'Не переживай, попробуй ещё раз!',
  'Почти получилось! Ещё чуть-чуть!',
  'Хитрый уровень… но ты хитрее — попробуй снова!',
  'Ошибаться — это нормально. Вперёд, ещё разок!',
  'Даже великие сыщики иногда ошибаются!',
  'Ничего страшного! Ты уже ближе к разгадке!',
  'Ой! Ну ничего, ты точно справишься!',
  'Это была тренировка. Теперь — по-настоящему!',
  'Не сдавайся! Загадка уже почти сдалась!',
  'Подвох оказался хитрым. Но ты его раскусишь!',
  'Спокойно! Настоящий детектив не сдаётся!',
  'Попробуй посмотреть на задачку по-другому 😉',
];
let lastWinIdx = -1, lastFailIdx = -1;
function pick(arr, lastIdx) { let i; do { i = Math.floor(Math.random() * arr.length); } while (i === lastIdx && arr.length > 1); return i; }

// ======== экраны ========
function showScreen(id) { ['menu', 'levels'].forEach(s => el(s).classList.toggle('show', s === id)); el('game').classList.toggle('show', id === 'game'); }
function refreshHud() { el('mCoins').textContent = S.coins; el('mBulbs').textContent = S.bulbs; el('gCoins').textContent = S.coins; el('gBulbs').textContent = S.bulbs; el('sCoins').textContent = S.coins; el('sBulbs').textContent = S.bulbs; }
function firstUnpassed() { for (let i = 0; i < LEVELS.length; i++) if (!S.passed[i]) return i; return LEVELS.length - 1; }
function renderLevels() {
  const g = el('levelsGrid'); g.innerHTML = '';
  const next = firstUnpassed();
  LEVELS.forEach((lv, i) => {
    const b = document.createElement('button'); b.className = 'lvBtn ' + (S.passed[i] ? 'done' : (i <= next ? 'next' : 'lock'));
    b.textContent = S.passed[i] ? '✅' : (i <= next ? (i + 1) : '🔒');
    if (S.passed[i]) b.textContent = (i + 1);
    if (S.passed[i] || i <= next) b.onclick = () => { sndClick(); startLevel(i); };
    g.appendChild(b);
  });
}

// ======== движок уровня ========
let cur = 0, levelApi = null, failLock = false, cleanupFns = [];
function setBulb(color) { el('redBulb').classList.toggle('on', color === 'red'); el('greenBulb').classList.toggle('on', color === 'green'); }
function startLevel(i) {
  cur = i; failLock = false;
  cleanupFns.forEach(f => f()); cleanupFns = [];
  showScreen('game'); startMusic();
  setBulb(null);
  el('lvLabel').textContent = 'Уровень ' + (i + 1);
  refreshHud();
  const lv = LEVELS[i];
  el('task').textContent = lv.task || '';
  const scene = el('scene'); scene.innerHTML = '';
  const svg = svgEl('svg', { viewBox: '0 0 800 560', preserveAspectRatio: 'xMidYMid meet' }, null);
  scene.appendChild(svg);
  const rng = mulberry32(lv.seed || (i * 1000 + 7));
  levelApi = {
    svg, rng, level: lv,
    on(target, ev, fn, opts) { target.addEventListener(ev, fn, opts); cleanupFns.push(() => target.removeEventListener(ev, fn, opts)); },
    win() { if (failLock) return; failLock = true; onWin(); },
    fail() { if (failLock) return; failLock = true; onFail(); },
  };
  TYPES[lv.t].build(svg, lv.p || {}, levelApi);
}
function onWin() {
  setBulb('green'); sndWin();
  const first = !S.passed[cur];
  if (first) { S.passed[cur] = true; S.coins += 10; save(); setTimeout(sndCoin, 500); }
  refreshHud();
  setTimeout(() => {
    lastWinIdx = pick(WIN_PHRASES, lastWinIdx);
    el('resEmoji').textContent = '🟢';
    el('resTitle').textContent = 'ПРАВИЛЬНО!';
    el('resPhrase').textContent = WIN_PHRASES[lastWinIdx];
    el('resReward').textContent = first ? '+10 🪙' : 'Уровень уже пройден — монетки не повторяются 😉';

const TYPES = {};
const WIRE_COLORS = ['#ff5252', '#3b9bff', '#3ecf5e', '#ffb300', '#b455ff', '#00c9c9', '#ff6ec7', '#8d6e63'];

TYPES.wires = { build(svg, p, api) {
  const n = p.n || 3, rng = api.rng;
  const H = 560, top = 130, bot = H - 60;
  const ys = []; for (let i = 0; i < n; i++) ys.push(top + (bot - top) * (n === 1 ? 0.5 : i / (n - 1)));
  // решение: розетка i на той же «высотной позиции», что вилка i (порядок сохранён → не пересекается)
  // плюс обманки: лишние розетки тех же цветов в перепутанных местах
  const colors = shuffle(WIRE_COLORS.slice(0, n), rng);
  const plugY = ys.slice();
  const sockSlots = shuffle(ys.slice(), rng); // визуально розетки стоят в другом порядке по вертикали? нет:
  //正解-розетки в том же порядке, обманки — со сдвигом
  const sockets = [];
  for (let i = 0; i < n; i++) sockets.push({ y: ys[i], color: colors[i], ok: true });
  const extra = Math.min(p.extra == null ? Math.max(1, n - 2) : p.extra, n);
  const used = new Set();
  for (let k = 0; k < extra; k++) {
    let i; do { i = Math.floor(rng() * n); } while (used.has(i)); used.add(i);
    let j; do { j = Math.floor(rng() * n); } while (Math.abs(j - i) < 1);
    sockets.push({ y: ys[j] + (rng() - 0.5) * 26, color: colors[i], ok: false });
  }
  shuffle(sockets, rng);
  const wiresG = svgEl('g', {}, svg), plugsG = svgEl('g', {}, svg), socksG = svgEl('g', {}, svg);
  const conns = new Map(); // plugIdx -> socket obj
  const sockTaken = new Set();
  const plugs = [];
  for (let i = 0; i < n; i++) {
    const g = svgEl('g', { transform: 'translate(70,' + plugY[i] + ')', cursor: 'pointer' }, plugsG);
    svgEl('rect', { x: -46, y: -16, width: 52, height: 32, rx: 8, fill: colors[i], stroke: '#26313f', 'stroke-width': 3 }, g);
    svgEl('rect', { x: 6, y: -7, width: 16, height: 4, rx: 2, fill: '#c9a44a' }, g);
    svgEl('rect', { x: 6, y: 3, width: 16, height: 4, rx: 2, fill: '#c9a44a' }, g);
    plugs.push({ x: 92, y: plugY[i], color: colors[i], g });
  }
  sockets.forEach(sk => {
    const g = svgEl('g', { transform: 'translate(724,' + sk.y + ')' }, socksG);
    svgEl('rect', { x: -14, y: -20, width: 44, height: 40, rx: 10, fill: '#f2f5f9', stroke: sk.color, 'stroke-width': 5 }, g);
    svgEl('circle', { cx: 8, cy: -7, r: 3.4, fill: '#26313f' }, g);
    svgEl('circle', { cx: 8, cy: 7, r: 3.4, fill: '#26313f' }, g);
    sk.gx = 710; sk.gy = sk.y; sk.g = g;
  });
  let drag = null, tempLine = null;
  function lineFor(i, x2, y2) { return 'M' + plugs[i].x + ',' + plugs[i].y + ' L' + x2 + ',' + y2; }
  function redraw() {
    wiresG.innerHTML = '';
    conns.forEach((sk, i) => svgEl('path', { d: lineFor(i, sk.gx, sk.gy), stroke: plugs[i].color, 'stroke-width': 8, fill: 'none', 'stroke-linecap': 'round' }, wiresG));
    if (drag != null && tempLine) wiresG.appendChild(tempLine);
  }
  function segsCross(a1, a2, b1, b2) {
    const d = (p, q, r) => (q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x);
    const s1 = d(a1, a2, b1), s2 = d(a1, a2, b2), s3 = d(b1, b2, a1), s4 = d(b1, b2, a2);
    return ((s1 > 0) !== (s2 > 0)) && ((s3 > 0) !== (s4 > 0));
  }
  function checkDone() {
    if (conns.size < n) return;
    const segs = [...conns.entries()].map(([i, sk]) => [{ x: plugs[i].x, y: plugs[i].y }, { x: sk.gx, y: sk.gy }]);
    for (let i = 0; i < segs.length; i++) for (let j = i + 1; j < segs.length; j++)
      if (segsCross(segs[i][0], segs[i][1], segs[j][0], segs[j][1])) return api.fail();
    api.win();
  }
  svg.addEventListener('pointerdown', ev => {
    const pt = svgPt(svg, ev);
    for (let i = 0; i < n; i++) if (Math.hypot(pt.x - plugs[i].x + 20, pt.y - plugs[i].y) < 46) {
      if (conns.has(i)) { sockTaken.delete(conns.get(i)); conns.delete(i); }
      drag = i; tempLine = svgEl('path', { d: lineFor(i, pt.x, pt.y), stroke: plugs[i].color, 'stroke-width': 8, fill: 'none', 'stroke-linecap': 'round', opacity: 0.75 }, null);
      redraw(); sndClick(); ev.preventDefault(); return;
    }
  });
  api.on(window, 'pointermove', ev => { if (drag == null) return; const pt = svgPt(svg, ev); tempLine.setAttribute('d', lineFor(drag, pt.x, pt.y)); });
  api.on(window, 'pointerup', ev => {
    if (drag == null) return; const pt = svgPt(svg, ev);
    let hit = null;
    for (const sk of sockets) if (!sockTaken.has(sk) && sk.color === plugs[drag].color && Math.hypot(pt.x - sk.gx - 8, pt.y - sk.gy) < 42) { hit = sk; break; }
    if (hit) { conns.set(drag, hit); sockTaken.add(hit); sndClick(); }
    drag = null; tempLine = null; redraw();
    checkDone();
  });
  redraw();
} };

TYPES.icecream = { build(svg, p, api) {
  const n = p.n || 8, realCount = p.real || 4, rng = api.rng;
  const idxs = shuffle([...Array(n).keys()], rng), realSet = new Set(idxs.slice(0, realCount));
  const items = [];
  const cols = Math.max(4, Math.ceil(n / 2)), sc = cols > 4 ? 0.82 : 1;
  for (let i = 0; i < n; i++) {
    const c = i % cols, r = Math.floor(i / cols);
    const x = 100 + c * (600 / (cols - 1)), y = 250 + r * 190;
    const g = svgEl('g', { transform: 'translate(' + x + ',' + y + ') scale(' + sc + ')', cursor: 'pointer' }, svg);
    // палочка
    svgEl('rect', { x: -8, y: 40, width: 16, height: 52, rx: 8, fill: '#d8a25c', stroke: '#a06c2c', 'stroke-width': 2 }, g);
    // «шоколадная» завитушка (одинаковая у всех!)
    const body = svgEl('g', {}, g);
    svgEl('ellipse', { cx: 0, cy: 26, rx: 44, ry: 20, fill: '#6b4423' }, body);
    svgEl('ellipse', { cx: 0, cy: 4, rx: 34, ry: 18, fill: '#7a4f28' }, body);
    svgEl('ellipse', { cx: 0, cy: -16, rx: 24, ry: 15, fill: '#8a5a2e' }, body);
    svgEl('circle', { cx: 0, cy: -34, r: 12, fill: '#96652f' }, body);
    const st = { g, body, real: realSet.has(i), revealed: false, chosen: false, x, y, drip: null };
    items.push(st);
  }
  // ☀️ солнце
  const sun = svgEl('g', { transform: 'translate(70,120)', cursor: 'grab' }, svg);
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; svgEl('line', { x1: Math.cos(a) * 40, y1: Math.sin(a) * 40, x2: Math.cos(a) * 54, y2: Math.sin(a) * 54, stroke: '#ffb300', 'stroke-width': 7, 'stroke-linecap': 'round' }, sun); }
  svgEl('circle', { r: 34, fill: '#ffd23b', stroke: '#e8a800', 'stroke-width': 4 }, sun);
  svgEl('circle', { cx: -10, cy: -6, r: 4, fill: '#a86e00' }, sun); svgEl('circle', { cx: 10, cy: -6, r: 4, fill: '#a86e00' }, sun);
  svgEl('path', { d: 'M-12,10 Q0,20 12,10', stroke: '#a86e00', 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round' }, sun);
  let sx = 70, sy = 120, dragS = false;
  svg.addEventListener('pointerdown', ev => { const pt = svgPt(svg, ev); if (Math.hypot(pt.x - sx, pt.y - sy) < 60) { dragS = true; ev.preventDefault(); return; }
    // клик по мороженке = выбор
    for (const it of items) { if (it.chosen) continue; if (Math.hypot(pt.x - it.x, pt.y - it.y) < 55) { chooseItem(it); return; } }
  });
  api.on(window, 'pointermove', ev => {
    if (!dragS) return; const pt = svgPt(svg, ev); sx = pt.x; sy = pt.y; sun.setAttribute('transform', 'translate(' + sx + ',' + sy + ')');
    for (const it of items) {
      const near = Math.hypot(sx - it.x, sy - it.y) < (p.reach || 110);
      if (near && !it.revealed) reveal(it);
    }
  });
  api.on(window, 'pointerup', () => { dragS = false; });
  function reveal(it) {
    it.revealed = true;
    if (it.real) { // тает!
      it.body.style.transition = 'transform 1s'; it.body.style.transformOrigin = '0px 40px'; it.body.setAttribute('transform', 'scale(1,0.72)');
      it.drip = svgEl('ellipse', { cx: 0, cy: 52, rx: 30, ry: 8, fill: '#8a5a2e', opacity: 0.85 }, it.g);
      const s = svgEl('text', { x: 30, y: -40, 'font-size': 22 }, it.g); s.textContent = '💧';
    } else { // мухи!
      const f = svgEl('text', { x: -42, y: -44, 'font-size': 22 }, it.g); f.textContent = '🪰';
      const f2 = svgEl('text', { x: 26, y: -52, 'font-size': 16 }, it.g); f2.textContent = '🪰';
    }
  }
  let found = 0;
  function chooseItem(it) {
    if (it.real) { it.chosen = true; found++; sndCoin(); const ok = svgEl('text', { x: -16, y: -56, 'font-size': 34 }, it.g); ok.textContent = '✅'; if (found >= realCount) api.win(); }
    else { const no = svgEl('text', { x: -16, y: -56, 'font-size': 34 }, it.g); no.textContent = '💩'; api.fail(); }
  }
} };

TYPES.bignum = { build(svg, p, api) {

// ---------- 🚰 ТРУБЫ С ВОДОЙ (идея Марка!) ----------
const DIRS = { N: [0, -1], E: [1, 0], S: [0, 1], W: [-1, 0] };
const OPP = { N: 'S', S: 'N', E: 'W', W: 'E' };
function rotDir(d) { return { N: 'E', E: 'S', S: 'W', W: 'N' }[d]; }
TYPES.pipes = { build(svg, p, api) {
  const W = p.w || 4, H = p.h || 3, rng = api.rng;
  const CS = Math.min(96, Math.floor(520 / W), Math.floor(380 / H));
  const ox = 400 - W * CS / 2, oy = 300 - H * CS / 2 + 20;
  // строим случайный путь слева направо
  const sr = Math.floor(rng() * H);
  const visited = new Set(); const cells = new Map(); // 'x,y' -> {dirs:Set}
  let x = 0, y = sr, inDir = 'W', er = sr;
  visited.add(x + ',' + y);
  while (true) {
    const opts = [];
    if (x < W - 1 && !visited.has((x + 1) + ',' + y)) opts.push('E', 'E');
    if (y > 0 && !visited.has(x + ',' + (y - 1))) opts.push('N');
    if (y < H - 1 && !visited.has(x + ',' + (y + 1))) opts.push('S');
    let out;
    if (x === W - 1 && (opts.length === 0 || rng() < 0.55)) out = 'E';
    else if (opts.length === 0) out = 'E';
    else out = opts[Math.floor(rng() * opts.length)];
    cells.set(x + ',' + y, { dirs: [inDir, out] });
    if (out === 'E' && x === W - 1) { er = y; break; }
    x += DIRS[out][0]; y += DIRS[out][1]; inDir = OPP[out]; visited.add(x + ',' + y);
  }
  // кран и цветок
  const tap = svgEl('text', { x: ox - 46, y: oy + sr * CS + CS / 2 + 14, 'font-size': 44, 'text-anchor': 'middle' }, svg); tap.textContent = '🚰';
  const flower = svgEl('text', { x: ox + W * CS + 44, y: oy + er * CS + CS / 2 + 14, 'font-size': 44, 'text-anchor': 'middle' }, svg); flower.textContent = '🌸';
  // тайлы
  const tiles = [];
  for (let cy = 0; cy < H; cy++) for (let cx = 0; cx < W; cx++) {
    const key = cx + ',' + cy;
    let dirs;
    if (cells.has(key)) dirs = cells.get(key).dirs.slice();
    else dirs = rng() < 0.5 ? ['N', 'S'] : ['N', 'E'];
    // запутываем: случайный поворот
    let rot = Math.floor(rng() * 4);
    let cur = dirs.slice(); for (let k = 0; k < rot; k++) cur = cur.map(rotDir);
    const g = svgEl('g', { transform: 'translate(' + (ox + cx * CS + CS / 2) + ',' + (oy + cy * CS + CS / 2) + ')', cursor: 'pointer' }, svg);
    svgEl('rect', { x: -CS / 2 + 2, y: -CS / 2 + 2, width: CS - 4, height: CS - 4, rx: 10, fill: '#f2f5f9', stroke: '#dfe6ee', 'stroke-width': 2 }, g);
    const pg = svgEl('g', {}, g);
    const t = { g, pg, dirs: cur, cx, cy };
    drawPipe(t);
    g.addEventListener('pointerdown', () => { t.dirs = t.dirs.map(rotDir); drawPipe(t); sndClick(); setTimeout(check, 60); });
    tiles.push(t);
  }
  function drawPipe(t, water) {
    t.pg.innerHTML = '';
    const col = water ? '#3b9bff' : '#9aa7b5';
    for (const d of t.dirs) svgEl('line', { x1: 0, y1: 0, x2: DIRS[d][0] * CS / 2, y2: DIRS[d][1] * CS / 2, stroke: col, 'stroke-width': 16, 'stroke-linecap': 'round' }, t.pg);
    svgEl('circle', { r: 10, fill: col }, t.pg);
  }
  function tileAt(cx, cy) { return tiles.find(t => t.cx === cx && t.cy === cy); }
  function check() {
    // вода течёт от крана
    let cx = 0, cy = sr, from = 'W'; const wet = [];
    for (let steps = 0; steps < W * H + 2; steps++) {
      const t = tileAt(cx, cy);
      if (!t || !t.dirs.includes(from)) return;
      const out = t.dirs.find(d => d !== from);
      wet.push(t);
      if (out === 'E' && cx === W - 1) {
        if (cy === er) { wet.forEach(w => drawPipe(w, true)); flower.textContent = '🌻'; svgEl('text', { x: ox + W * CS + 44, y: oy + er * CS + CS / 2 - 34, 'font-size': 26, 'text-anchor': 'middle' }, svg).textContent = '💧'; api.win(); }
        return;
      }
      cx += DIRS[out][0]; cy += DIRS[out][1]; from = OPP[out];
      if (cx < 0 || cy < 0 || cx >= W || cy >= H) return;
    }
  }
} };

TYPES.onestroke = { build(svg, p, api) {

  });
  const counter = svgEl('text', { x: 400, y: 165, 'text-anchor': 'middle', 'font-size': 26, 'font-weight': 900, fill: '#8b97a6' }, svg);

  }

  api.on(window, 'pointerup', () => { if (dragging) { dragging = false; handle.setAttribute('transform', 'translate(70,0)'); } });

TYPES.trick_pet = { build(svg, p, api) {

  svgEl('ellipse', { cx: 0, cy: 40, rx: 95, ry: 70, fill: '#e8a33d' }, cat);
  svgEl('circle', { cx: 0, cy: -50, r: 56, fill: '#e8a33d' }, cat);
  svgEl('polygon', { points: '-46,-86 -30,-118 -14,-88', fill: '#e8a33d' }, cat);
  svgEl('polygon', { points: '14,-88 30,-118 46,-86', fill: '#e8a33d' }, cat);
  svgEl('circle', { cx: -18, cy: -56, r: 7, fill: '#1b1b1b' }, cat); svgEl('circle', { cx: 18, cy: -56, r: 7, fill: '#1b1b1b' }, cat);
  svgEl('path', { d: 'M-10,-38 q10,10 20,0', stroke: '#1b1b1b', 'stroke-width': 4, fill: 'none' }, cat);

  });
} };
